name: Review Status Sync

on:
  pull_request:
    types: [labeled]

permissions:
  statuses: write

jobs:
  sync:
    if: github.event.label.name == 'review-pass' || github.event.label.name == 'needs-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Set claude/review commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          LABEL: ${{ github.event.label.name }}
        run: |
          if [ "$LABEL" = "review-pass" ]; then
            STATE=success
            DESC="pr-review: matches the spec"
          else
            STATE=failure
            DESC="pr-review: needs-fix — see PR comments"
          fi
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context="claude/review" \
            -f description="$DESC"
