name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production
        run: pnpm build

      - name: Verify all public/ assets are in the artifact
        run: |
          for f in public/*; do
            name=$(basename "$f")
            test -e "dist/$name" \
              || (echo "Missing from artifact: $name" && exit 1)
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test deployed site
        env:
          BASE: ${{ needs.deploy.outputs.page_url }}
        run: |
          for path in "" manifest.json sw.js css/styles.css; do
            url="${BASE}${path}"
            echo "Checking $url..."
            for i in 1 2 3 4 5; do
              curl --fail --silent --head "$url" && break
              [ $i -eq 5 ] && echo "FAILED: $url" && exit 1
              echo "Retry $i/5 in 15s..."
              sleep 15
            done
          done
